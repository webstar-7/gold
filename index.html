<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b2110">
<title>NYANSATEK Gold</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#17264a;--ink-soft:rgba(23,38,74,.1);--accent:#d1a03a;--accent-soft:rgba(209,160,58,.16);--accent-ink:#1a1405;
--paper:#f3f4f7;--card:#fff;--line:#e2e6ec;--text:#1b2433;--muted:#667487;
--ok:#1b9a62;--ok-bg:#e2f5ec;--warn:#b76e00;--warn-bg:#fdf0d9;--bad:#d24545;--bad-bg:#fbe5e5;--info:#2f6fda;--info-bg:#e4edfc;
--r:10px;--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;font:15px/1.45 var(--font);color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(320px,46%) 1fr}
.login-l{background:var(--accent);color:var(--ink);padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
.login-l .mono{width:56px;height:56px;font-size:24px;border-radius:15px}
.login-l h1{font-size:34px;line-height:1.12;margin:26px 0 12px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.login-l p.tag{font-size:16px;color:rgba(23,38,74,.75);max-width:34ch}
.login-l ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.login-l li{display:flex;gap:12px;align-items:flex-start;color:rgba(23,38,74,.86);font-size:14.5px}
.login-l li i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-top:8px}
.login-r{display:grid;place-items:center;padding:32px}
.login-card{width:100%;max-width:380px}
.login-card h2{font-size:22px;margin-bottom:4px}
.login-card .sub{color:var(--muted);margin-bottom:22px}
.login-card .btn{width:100%;padding:11px;margin-top:6px}
.login-card .demo{margin-top:16px;font-size:13px;color:var(--muted)}
@media(max-width:820px){.login{grid-template-columns:1fr}.login-l{padding:28px}.login-l h1{font-size:26px}.login-l ul{display:none}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh;min-width:0}
.side{background:var(--ink);color:#e9edf7;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 18px}
.mono{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;overflow:hidden;padding:0}
.mono svg{width:100%;height:100%;display:block}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand small{color:rgba(233,237,247,.62);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;padding-right:2px}
.nav .gap{height:10px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:rgba(233,237,247,.8);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:14.5px}
.nav button svg,.ico{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.side .foot{margin-top:auto;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.14);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side .foot b{display:block;font-size:13.5px}
.side .foot span{color:rgba(233,237,247,.6)}
.side .foot button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.net{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;font-size:13.5px;font-weight:600}
.net .dot{width:9px;height:9px;border-radius:50%;background:#9aa6b5}
.net.on{border-color:#a9dcc3;background:var(--ok-bg);color:#0f6b43}
.net.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(27,154,98,.18)}
.chip{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
.chip b{color:var(--text)}
.chip i{font-style:normal;color:var(--warn);font-weight:600;margin-left:6px}
.view{padding:24px 28px 70px;max-width:1600px;width:100%}
.view.view-wide{max-width:none}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:column;padding:10px}
 .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nav .gap{display:none}
 .nav button{white-space:nowrap;padding:8px 10px}.side .foot{display:none}.brand{padding-bottom:8px}
 .top,.view{padding-left:14px;padding-right:14px}
}

/* ---------- basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card>h3,.card-h{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.num{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px;min-width:0}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#bfc8d4}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .sp{flex:1}
input,select,textarea{border:1px solid #b9c9e8;border-radius:8px;padding:8px 10px;background:#e9f0fc;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);background:#fff}
.search{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:650;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:#0f6b43}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:#a82c2c}.b-info{background:var(--info-bg);color:#1f52ad}.b-mute{background:#eceff3;color:#4d5a6b}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
td{padding:10px 12px;border-bottom:1px solid #edf0f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfd}
td.acts,th.acts{text-align:right;white-space:nowrap}
td.acts .btn{margin-left:4px}
.tc{padding:0;overflow:hidden}
.sub2{display:block;color:var(--muted);font-size:12.5px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.strip .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px;color:var(--muted)}
.strip .s b{display:block;color:var(--text);font-size:17px;line-height:1.25}
.prog{height:8px;border-radius:99px;background:#e9edf2;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog.warn i{background:#e0a020}.prog.bad i{background:var(--bad)}.prog.acc i{background:var(--accent)}

/* ---------- forms + modal ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:block}.fld.full{grid-column:1/-1}
.fld>span{display:block;font-size:13px;font-weight:650;color:#455266;margin-bottom:4px}
.fld small{color:var(--muted);font-size:12.5px}
.pwwrap{position:relative;display:flex}
.pwwrap input{flex:1;padding-right:56px}
.pwtoggle{position:absolute;right:4px;top:4px;bottom:4px;border:0;background:#eceff3;color:#455266;font-size:12px;font-weight:650;border-radius:6px;padding:0 10px;cursor:pointer}
.pwtoggle:hover{background:#dfe4ea}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.modal-back{position:fixed;inset:0;background:rgba(14,22,38,.5);display:grid;place-items:center;padding:18px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 24px 70px rgba(10,18,32,.35)}
.modal.wide{max-width:820px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h3{font-size:17px}
.modal .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.mbody{padding:20px;max-height:68vh;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
#toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

/* ---------- dashboard ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{font-size:24px;letter-spacing:-.3px}
.hello p{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px}
.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:#e0a020}.kpi.ok{border-left-color:var(--ok)}.kpi.info{border-left-color:var(--info)}
.kl{display:block;color:var(--muted);font-size:13.5px}
.kv{display:block;font-size:26px;font-weight:750;letter-spacing:-.5px;margin:2px 0}
.ks{display:block;color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:12px var(--font);fill:#667487}
.chart .v{font-weight:700;fill:#1b2433}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f4}
.list li:last-child{border-bottom:0}
.list b{display:block;font-weight:650}
.list span{color:var(--muted);font-size:13px}
.list em{font-style:normal;font-weight:700;white-space:nowrap}

/* ---------- scan / result ---------- */
.scan{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.scan{grid-template-columns:1fr}}
.scanbox{text-align:center;padding:28px 22px}
.scanbox .big{font-size:20px;font-weight:700;margin:6px 0 4px}
.scanbox input.code{font-size:22px;text-align:center;letter-spacing:2px;padding:14px;margin:14px 0 6px;border-width:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:#fff;padding:8px 20px;cursor:pointer;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.tryit{margin-top:16px;text-align:left}
.tryit>span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.res-back{position:fixed;inset:0;background:rgba(14,22,38,.55);display:grid;place-items:center;z-index:90;padding:18px}
.res-card{background:#fff;border-radius:18px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.res-banner{padding:22px;text-align:center;color:#fff}
.res-banner.ok{background:var(--ok)}.res-banner.bad{background:var(--bad)}.res-banner.warn{background:#d98a11}
.res-banner b{display:block;font-size:26px;letter-spacing:.5px}
.res-body{padding:22px;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--ink);color:#fff;font-size:24px;font-weight:700}
.res-body h4{font-size:20px}
.res-body .rows{margin-top:14px;background:#f5f7fa;border-radius:10px;padding:8px 14px;text-align:left}
.res-body .rows div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;gap:10px}
.res-body .rows div span:first-child{color:var(--muted)}
.res-body .rows div span:last-child{font-weight:650;text-align:right}
@media(prefers-reduced-motion:reduce){.res-card{animation:none}}

/* ---------- till ---------- */
.till{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.till>aside.card{position:sticky;top:86px;height:calc(100vh - 102px);display:flex;flex-direction:column;overflow:hidden}
.till>aside.card>.card-h{flex:none}
.till>aside.card .cartlines{flex:1 1 auto;overflow:auto;min-height:48px;margin:0 -18px;padding:0 18px}
.till>aside.card .cartfoot{flex:none;padding-top:12px;margin-top:10px;border-top:1px solid var(--line)}
@media(max-width:1000px){.till{grid-template-columns:1fr}.till>aside.card{position:static;height:auto;display:block;overflow:visible}.till>aside.card .cartlines{overflow:visible;max-height:none;margin:0;padding:0}}
.gfoot{position:fixed;left:0;right:0;bottom:8px;display:flex;justify-content:center;pointer-events:none;z-index:50}
.gfoot span{background:rgba(255,255,255,.9);color:#445064;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:14px;line-height:1.25}
.tile .p{margin-top:auto;font-weight:750;font-size:15.5px}
.tile small{color:var(--muted)}
.tile.out{opacity:.5}
.tile.blocked{background:var(--bad-bg);border-color:#efbcbc}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f4}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty span{min-width:24px;text-align:center;font-weight:650}
.totalrow{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.rcpt{font:13px/1.4 "Courier New",monospace;width:300px;margin:0 auto;color:#000}
.rcpt h4{text-align:center;font-size:16px;margin:0}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .b{font-weight:700;font-size:15px}

/* ---------- boards ---------- */
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1100px){.kan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kan{grid-template-columns:1fr}}
.col{background:#eef1f5;border-radius:12px;padding:10px;min-height:200px}
.col h4{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px 10px}
.col h4 span{background:#fff;border-radius:99px;padding:0 9px;font-size:13px}
.qc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.qc .n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;margin-right:8px}
.qc b{font-size:14.5px}
.qc p{font-size:13px;color:var(--muted);margin:4px 0 8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.room{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ok);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:2px}
.room:hover{box-shadow:0 4px 14px rgba(20,30,50,.1)}
.room .no{font-size:22px;font-weight:800;letter-spacing:-.3px}
.room small{color:var(--muted)}
.room .who{margin-top:auto;font-weight:650;font-size:13.5px}
.room.occupied{border-top-color:var(--bad)}.room.cleaning{border-top-color:#e0a020}.room.maintenance{border-top-color:#8896a8;opacity:.75}
.seatwrap{max-width:330px;margin:0 auto;padding:18px 16px;background:#eef1f5;border-radius:26px 26px 14px 14px}
.cab{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 6px 12px}
.srow{display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;gap:8px;margin-bottom:8px}
.seat{height:38px;border-radius:8px;border:1px solid #b9c4d2;background:#fff;font-weight:700;cursor:pointer;font-size:13.5px}
.seat:hover{border-color:var(--accent);background:var(--accent-soft)}
.seat.sold{background:#cfd6df;color:#7d8998;cursor:not-allowed;border-color:#cfd6df}
.tripcard{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;margin-bottom:8px;display:block}
.tripcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tripcard b{display:block}
.tripcard span{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #b9c4d2;background:#fff;margin-right:5px;vertical-align:-2px}
.legend i.s{background:#cfd6df;border-color:#cfd6df}
.sms-out .m{max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{resize:vertical}

</style>
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
